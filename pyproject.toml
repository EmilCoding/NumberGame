[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numbergame"
version = "0.1.0"
description = "A number guessing game with different guessing strategies"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "elboe"}
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]
